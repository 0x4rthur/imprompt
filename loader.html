<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imprompt</title>
    <style>
      /* Mesmo sistema do app (styles.css), inline pra janela abrir sem esperar o
         bundle: claro "Mono / Cream" ou escuro "Mono / Ink", seguindo o sistema.
         Janela OPACA — sem transparência, pra não revelar o desktop atrás (o
         "vidro"). A sombra é nativa da janela. */
      :root{
        color-scheme:light;
        --bg:oklch(0.992 0.002 286);
        --edge:oklch(0.21 0.006 286 / .16);
        --ink:oklch(0.21 0.006 286);
        --bracket:oklch(0.82 0.008 286);
      }
      @media (prefers-color-scheme: dark){
        :root{
          color-scheme:dark;
          --bg:oklch(0.185 0.005 286);
          --edge:oklch(0.98 0.003 286 / .14);
          --ink:oklch(0.955 0.003 286);
          --bracket:oklch(0.48 0.010 286);
        }
      }
      html,body{margin:0; height:100%; overflow:hidden}
      body{ background:var(--bg); border:1px solid var(--edge); box-sizing:border-box }
      .imprompting{
        display:flex; align-items:center; justify-content:center; gap:11px;
        height:100%; box-sizing:border-box; padding:0 16px;
        font-family:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
      }
      .glyph{line-height:0; display:inline-flex}
      .glyph .b{fill:var(--bracket)}
      .glyph .i{fill:var(--ink)}
      .text{ font-size:13px; font-weight:600; color:var(--ink) }
      /* Três quadradinhos de cantos levemente arredondados, piscando em sequência. */
      .dots{display:inline-flex; gap:3px}
      .dots i{width:5px; height:5px; border-radius:1.5px; background:var(--ink); animation:blinkdot 1.1s infinite}
      .dots i:nth-child(2){animation-delay:.18s}
      .dots i:nth-child(3){animation-delay:.36s}
      @keyframes blinkdot{0%,40%{opacity:1}60%,100%{opacity:.18}}
      @media (prefers-reduced-motion:reduce){ *{animation:none !important} }
    </style>
  </head>
  <body>
    <div class="imprompting" role="status">
      <span class="glyph">
        <svg viewBox="0 0 62 40" width="33" height="21" aria-hidden="true">
          <g class="b">
            <rect x="2" y="4" width="5" height="32"/>
            <rect x="2" y="4" width="14" height="5"/>
            <rect x="2" y="31" width="14" height="5"/>
            <rect x="55" y="4" width="5" height="32"/>
            <rect x="46" y="4" width="14" height="5"/>
            <rect x="46" y="31" width="14" height="5"/>
          </g>
          <g class="i">
            <rect x="28.5" y="4" width="5" height="32"/>
            <rect x="22" y="4" width="18" height="5"/>
            <rect x="22" y="31" width="18" height="5"/>
          </g>
        </svg>
      </span>
      <span class="text">Imprompting…</span>
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <script>document.addEventListener("contextmenu", function (e) { e.preventDefault(); });</script>
  </body>
</html>
